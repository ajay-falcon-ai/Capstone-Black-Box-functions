# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function1DataHandler
data_class: Function1DataHandler

source_label: "week-x"
yield_col: "radiation-reading"

bayesopt:
  methods: ["PI", "EI", "UCB"]
  # Acquisition parameters
  xi_values: [0.0, 0.01, 0.1]   # 0.0 = pure exploitation, >0 = more exploration
  kappa_values: [0.5, 1.0, 2.0] # lower = exploit, higher = explore
  grid_sizes: [600]
  apply_scaling: true
  # Filtering strategy
  sample_strategy: "lhs"   # cartesian / latin hypercube sampling (lhs) / sobol

  filter_mode: "gp"
  filter_training_mode: "exploration"   # exploitation/exploration/hybrid
  filter_strategy: "boundary"         # boundary (explore) or good (exploit)

  downsample_grid: false     # to downsample or not.
  downsample_stride: 2      # higher stride means more downsampling.
  optimization_direction: "max"   # min or "max"


model:
  type: cnn   # or "cnn" or llm
  params:
    input_dim: 2
    lr: 0.001
    epochs: 500
    patience: 30
  llm:
    enabled: true
    provider: "openai"        # "openai" or "azure", "anthropic", etc.
    model: "gpt-4.1"          # model identifier
    temperature: 0.7          # controls randomness
    max_tokens: 256           # response length limit
    top_p: 0.9        # nucleus sampling
    top_k: 40         # token cutoff

    prompt_pattern: "zero-shot"
    template: |
      You are helping with Bayesian optimisation.
      Here are the observed input-output pairs so far:

      Inputs: {inputs}
      Outputs: {outputs}

      Based on these, suggest the next best candidate input point
      to evaluate. Note that only proximity yeilds a non-zero reading in a contamination radiation field. Return only a JSON array of numbers to six decimals, e.g. [0.120645, 0.4578095].

    # prompt_pattern: "few-shot"
    # template: |
    #   You are helping with Bayesian optimisation.
    #   Here are some examples of how to suggest the next candidate point:

    #   Example 1:
    #   Inputs: [[0.1, 0.2], [0.3, 0.4]]
    #   Outputs: [1.0]
    #   Next candidate: [0.25, 0.35]

    #   Example 2:
    #   Inputs: [[0.5, 0.6], [0.7, 0.8]]
    #   Outputs: [3.0]
    #   Next candidate: [0.6, 0.7]

    #   Now, here are the observed input-output pairs so far:

    #   Inputs: {inputs}
    #   Outputs: {outputs}

    #   Based on these, suggest the next best candidate input point
    #   to evaluate. Return only a JSON array of numbers, e.g. [0.120645, 0.4578095].

plot:
  scale_factor: 1.0
  yield_scale_factor: 100.0
  source_color: red
  source_marker_style: x
  show_candidates: true   # <-- new flag
  figsize: [6, 5]

display:
  matplotlib:
    figsize: [12, 10]      # width, height in inches
    dpi: 100
    font_size: 12
  pandas:
    display_max_rows: null   # null means "no limit"; set an integer to limit rows
    display_max_colwidth: null
    display_width: 0
    display_expand_frame_repr: false
