# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function8DataHandler
data_class: Function8DataHandler

source_label: "week-x"
yield_col: "output"

bayesopt:
  optimization_direction: "max"   # min or "max"
  methods: ["EI", "UCB"]
  # Acquisition parameters
  xi_values: [0.0, 0.1, 0.2, 0.3]   # 0.0 = pure exploitation, >0 = more exploration
  kappa_values: [1.0, 2.0, 3.0] # lower = exploit, higher = explore
  grid_sizes: [4194304]
  apply_scaling: true
  # sampling strategy
  sample_strategy: "sobol"   # cartesian / latin hypercube sampling (lhs) / sobol
  # Filtering strategy
  filter_mode: null
  filter_training_mode: null   # exploitation/exploration/hybrid
  filter_strategy: null         # boundary (explore) or good (exploit)

  downsample_grid: false     # to downsample or not.
  downsample_stride: 6      # higher stride means more downsampling.

model:
  type: cnn   # "llm" or "cnn"
  params:
    input_dim: 8
    lr: 0.001
    epochs: 600
    patience: 20
  objective_mode: "raw"   # raw, zero_target or negated
  llm:
    enabled: true
    provider: "openai"        # "openai" or "azure", "anthropic", etc.
    model: "gpt-4.1"          # model identifier
    temperature: 0.7          # controls randomness
    max_tokens: 256           # response length limit
    top_p: 0.5        # nucleus sampling
    top_k: 40         # token cutoff

    prompt_pattern: "zero-shot"
    template: |
      You are helping with Bayesian optimisation.
      Here are the observed input-output pairs so far:

      Inputs: {inputs}
      Outputs: {outputs}

      Based on these, suggest the next best candidate input point
      to evaluate. Each input set returns a single validation accuracy score between 0 and 1, the goal is to maximise this score. Return only a JSON array of numbers to 6 decimals, e.g. [0.120645, 0.4578095, 0.765645, 0.347838, 0.897654, 0.382762, 0.987365, 0.796543].

    # prompt_pattern: "few-shot"
    # template: |
    #   You are helping with Bayesian optimisation.
    #   Here are some examples of how to suggest the next candidate point:

    #   Example 1:
    #   Inputs: [[0.1, 0.2], [0.3, 0.4]]
    #   Outputs: [1.0]
    #   Next candidate: [0.25, 0.35]

    #   Example 2:
    #   Inputs: [[0.5, 0.6], [0.7, 0.8]]
    #   Outputs: [3.0]
    #   Next candidate: [0.6, 0.7]

    #   Now, here are the observed input-output pairs so far:

    #   Inputs: {inputs}
    #   Outputs: {outputs}

    #   Based on these, suggest the next best candidate input point
    #   to evaluate. Return only a JSON array of numbers, e.g. [0.120645, 0.4578095].

plot:
  scale_factor: 10.0
  yield_scale_factor: 1.0
  source_color: "red"
  source_marker_style: "x"
  figsize: [6, 5]