# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function8DataHandler
data_class: Function8DataHandler

source_label: "week-x"
yield_col: "output"

bayesopt:
  methods: ["PI", "EI", "UCB"]
  # Acquisition parameters
  xi_values: [0.0, 0.01]   # 0.0 = pure exploitation, >0 = more exploration
  kappa_values: [0.5, 1.0] # lower = exploit, higher = explore
  grid_sizes: [100]
  apply_scaling: true

  sample_strategy: "lhs"   # cartesian / latin hypercube sampling (lhs) / sobol
  # Filtering strategy
  filter_mode: "median"
  training_mode: "exploitation"   # exploitation/exploration/hybrid
  filter_strategy: "good"         # boundary (explore) or good (exploit)

  downsample_grid: true     # to downsample or not.
  downsample_stride: 6      # higher stride means more downsampling.
  optimization_direction: "max"   # min or "max"

model:
  type: cnn   # or "cnn"
  params:
    input_dim: 8
    lr: 0.001
    epochs: 600
    patience: 20
  objective_mode: "raw"   # raw, zero_target or negated

plot:
  scale_factor: 10.0
  yield_scale_factor: 1.0
  source_color: "red"
  source_marker_style: "x"
  figsize: [6, 5]