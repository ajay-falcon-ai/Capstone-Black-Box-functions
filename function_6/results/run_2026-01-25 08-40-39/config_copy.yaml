data_module: Function6DataHandler
data_class: Function6DataHandler
source_label: week-x
yield_col: flavour-score
bayesopt:
  methods:
  - EI
  xi_values:
  - 0.0
  - 0.1
  grid_sizes:
  - 1048576
  apply_scaling: true
  filter_mode: null
  filter_training_mode: null
  filter_strategy: null
  sample_strategy: sobol
  downsample_grid: false
  downsample_stride: 5
  optimization_direction: max
model:
  type: cnn
  params:
    input_dim: 5
    lr: 0.001
    epochs: 600
    patience: 20
  objective_mode: negated
  llm:
    enabled: true
    provider: openai
    model: gpt-4.1
    temperature: 0.7
    max_tokens: 256
    top_p: 0.9
    top_k: 40
    prompt_pattern: zero-shot
    template: 'You are helping with Bayesian optimisation.

      Here are the observed input-output pairs so far:


      Inputs: {inputs}

      Outputs: {outputs}


      Based on these, suggest the next best candidate input point

      to evaluate. Note that the total score negative, the goal is to bring that score
      as close to zero as possible, or maximise the negative of the total sum. Return
      only a JSON array of numbers to 6 decimals, e.g. [0.120645, 0.4578095, 0.765645,
      0.347838, 0.897654].

      '
plot:
  scale_factor: 1.0
  yield_scale_factor: 1.0
  source_color: red
  source_marker_style: x
  figsize:
  - 6
  - 5
