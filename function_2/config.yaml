# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function2DataHandler
data_class: Function2DataHandler


source_label: "week-x"
yield_col: "log-likelyhood-score"

bayesopt:
  xi_values: [0.01, 0.5]
  kappa_values: [1.0, 2.5]
  grid_sizes: [200]
  methods: ["PI", "EI", "UCB"]
  apply_scaling: true
  filter_mode: "median" # median is robust under output noise
  downsample_grid: false     # in smaller dimensions there is no need to downsample.
  downsample_stride: 1       # higher stride means more downsampling.

model:
  type: cnn   # or "cnn"
  params:
    input_dim: 2
    lr: 0.001
    epochs: 500
    patience: 20

plot:
  scale_factor: 100.0
  yield_scale_factor: 100.0
  source_color: red
  source_marker_style: "x"
  show_candidates: true   # <-- new flag
  figsize: [6, 5]
