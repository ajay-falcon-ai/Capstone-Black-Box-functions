# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function3DataHandler
data_class: Function3DataHandler

source_label: "week-x"
yield_col: "trans-side-effect"

bayesopt:
  methods: ["PI", "EI", "UCB"]
  # Acquisition parameters
  xi_values: [0.0, 0.01]   # 0.0 = pure exploitation, >0 = more exploration
  kappa_values: [0.5, 1.0] # lower = exploit, higher = explore
  grid_sizes: [200]
  apply_scaling: true
  # Filtering strategy

  filter_mode: "gp"
  training_mode: "exploration"   # exploitation/exploration/hybrid
  filter_strategy: "boundary"         # boundary (explore) or good (exploit)

  downsample_grid: true     # to downsample or not.
  downsample_stride: 4      # higher stride means more downsampling.
  optimization_direction: "max"   # min or "max"


model:
  type: cnn   # or "cnn"
  params:
    input_dim: 3
    lr: 0.001
    epochs: 500
    patience: 20
  objective_mode: "raw"   # raw, zero_target or negated

plot:
  scale_factor: 1.0
  yield_scale_factor: 100.0
  source_color: red
  source_marker_style: "x"
  show_candidates: true   # <-- new flag
  figsize: [6, 5]
