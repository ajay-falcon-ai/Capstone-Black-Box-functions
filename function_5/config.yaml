# config.yaml (edit only this file per experiment)
# data_module and data_class are optional; they will be inferred from folder name if omitted.
data_module: Function5DataHandler
data_class: Function5DataHandler

source_label: "week-x"
yield_col: "yield"

bayesopt:
  xi_values: [0.0, 0.01]
  kappa_values: [0.5, 1.0]
  grid_sizes: [100]
  methods: ["PI", "EI", "UCB"]
  apply_scaling: true
  filter_mode: "gp"
  downsample_grid: true     # to downsample or not.
  downsample_stride: 4            # higher stride means more downsampling.

model:
  type: mlp   # or "cnn"
  params:
    input_dim: 4
    lr: 0.001
    epochs: 500
    patience: 20

plot:
  scale_factor: 2000.0
  yield_scale_factor: 1.0
  source_color: red
  source_marker_style: "x"
  show_candidates: true   # <-- new flag
  figsize: [6, 5]
